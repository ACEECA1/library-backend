$kind: http-request
url: "{{baseUrl}}/api/books/1/comments"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "text": "This is an amazing book!",
      "parentCommentId": null,
      "isDraft": false
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 1000
