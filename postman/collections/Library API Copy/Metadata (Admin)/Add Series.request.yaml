$kind: http-request
url: "{{baseUrl}}/api/metadata/series"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Harry Potter",
      "description": "Series by J.K. Rowling"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
