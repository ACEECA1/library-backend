$kind: http-request
url: "{{baseUrl}}/api/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "oldPassword": "password123",
      "newPassword": "newpassword123"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 4000
