$kind: http-request
url: "{{baseUrl}}/api/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "bookId": 1,
      "rating": 5,
      "text": "Loved it! Highly recommended."
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 1000
