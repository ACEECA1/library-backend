$kind: http-request
url: "{{baseUrl}}/api/admin/users/2/roles"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "userId": 2,
      "roleNames": ["CONTENT_MANAGER", "USER"]
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 5000
